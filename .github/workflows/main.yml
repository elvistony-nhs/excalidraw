name: Build Excalidraw for IIS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build Excalidraw
        run: yarn build:app:docker

      - name: Verify build output
        run: |
          test -f excalidraw-app/build/index.html
          echo "Build completed successfully"
          find excalidraw-app/build -maxdepth 2 -type f | head -50

      - name: Create IIS deployment ZIP
        run: |
          cd excalidraw-app/build
          zip -r ../../excalidraw-iis.zip .

      - name: Upload IIS deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-iis
          path: excalidraw-iis.zip
          if-no-files-found: error
          retention-days: 30
